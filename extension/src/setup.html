<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etsy Pattern Detector Setup</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #111827;
        --panel: #1f2937;
        --panel-alt: #0f172a;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --accent: #60a5fa;
        --success: #34d399;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), var(--panel-alt));
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        width: min(720px, calc(100vw - 32px));
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 2.6rem);
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.35);
        color: var(--success);
        font-weight: 600;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.8);
      }

      .meta {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--muted);
        font-size: 0.96rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Etsy Pattern Detector</h1>
      <p>
        This extension is installed and ready to scan Etsy listing images for potential AI-generated pattern content.
      </p>
      <div class="status">
        <span class="dot"></span>
        Extension loaded successfully
      </div>

      <div class="meta">
        You can now open an Etsy listing page and use the extension to inspect the main product image.
      </div>
    </main>
  </body>
</html>
