<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RateThatSlop</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>RateThatSlop</h1>
      <p class="intro">Analyze Etsy listing images locally in your browser.</p>
      <button id="scan-page" type="button">Scan current Etsy page</button>
      <button id="show-scraped-data" type="button">Show scraped data (temporary)</button>
      <form id="analyze-form">
        <label for="image-url">Direct image URL</label>
        <input id="image-url" name="image-url" type="url"
          placeholder="https://i.etsystatic.com/.../image.jpg" required>
        <button type="submit">Analyze image</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="page-results" hidden>
        <h2>Current page</h2>
        <p id="page-summary"></p>
        <div id="image-results"></div>
      </section>
      <section id="scraped-data" hidden>
        <h2>Temporary scraped data</h2>
        <p id="scraped-data-summary"></p>
        <pre id="scraped-data-output" aria-label="Temporary scraped data"></pre>
      </section>
      <section id="result" aria-live="polite" hidden>
        <h2 id="result-label"></h2>
        <p id="result-score"></p>
        <dl>
          <div><dt>Threshold</dt><dd id="result-threshold"></dd></div>
          <div><dt>Model</dt><dd id="result-model"></dd></div>
          <div><dt>Processing time</dt><dd id="result-time"></dd></div>
        </dl>
      </section>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
